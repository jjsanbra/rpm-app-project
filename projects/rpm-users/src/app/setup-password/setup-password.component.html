<div class="auth-wrapper">
  <p-card class="auth-card-prime glass-panel-glow">
    <ng-template #header>
      <div class="auth-header">
        <span class="auth-icon">🔐</span>
        <h1 class="auth-title">{{ 'AUTH.SETUP_TITLE' | translate }}</h1>
        <p class="auth-subtitle">{{ 'AUTH.SETUP_SUBTITLE' | translate }}</p>
      </div>
    </ng-template>

    @if (successMessage()) {
      <div class="success-box">
        <p-message severity="success" styleClass="w-full mb-3">{{ successMessage() }}</p-message>
        <button
          type="button"
          pButton
          severity="success"
          routerLink="/auth/login"
          styleClass="w-full mt-2">
          <i class="pi pi-sign-in"></i>
          <span>{{ 'AUTH.GO_TO_LOGIN' | translate }}</span>
        </button>
      </div>
    } @else {
      @if (errorMessage()) {
        <p-message severity="error" styleClass="w-full mb-3">{{ errorMessage() }}</p-message>
      }

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-field">
          <label class="form-label" for="password">{{ 'AUTH.NEW_PASSWORD' | translate }}</label>
          <p-password
            id="password"
            [(ngModel)]="password"
            name="password"
            [feedback]="true"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            placeholder="••••••••"
            required
            [minlength]="8">
          </p-password>
        </div>

        <div class="form-field">
          <label class="form-label" for="confirmPassword">{{ 'AUTH.CONFIRM_PASSWORD' | translate }}</label>
          <p-password
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full"
            placeholder="••••••••"
            required>
          </p-password>
        </div>

        <button
          type="submit"
          pButton
          severity="success"
          styleClass="w-full mt-2"
          [loading]="loading()"
          [disabled]="loading() || !token">
          <i class="pi pi-check"></i>
          <span>{{ 'AUTH.SETUP_SUBMIT' | translate }}</span>
        </button>
      </form>
    }
  </p-card>
</div>
