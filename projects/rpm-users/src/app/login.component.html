<div class="auth-wrapper">
  <p-card class="auth-card-prime glass-panel-glow">
    <ng-template #header>
      <div class="auth-header">
        <span class="auth-icon">🎾</span>
        <h1 class="auth-title">{{ 'AUTH.LOGIN_TITLE' | translate }}</h1>
        <p class="auth-subtitle">{{ 'AUTH.LOGIN_SUBTITLE' | translate }}</p>
      </div>
    </ng-template>

    @if (errorMessage()) {
      <p-message severity="error" styleClass="w-full mb-3">{{ errorMessage() }}</p-message>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label class="form-label" for="email">{{ 'AUTH.EMAIL' | translate }}</label>
        <input
          id="email"
          type="email"
          pInputText
          class="w-full"
          [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>

      <div class="form-field">
        <div class="flex justify-between items-center mb-1">
          <label class="form-label" for="password">{{ 'AUTH.PASSWORD' | translate }}</label>
          <a routerLink="/auth/forgot-password" class="forgot-link">{{ 'AUTH.FORGOT_PASSWORD_LINK' | translate }}</a>
        </div>
        <p-password
          id="password"
          [(ngModel)]="password"
          name="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          placeholder="••••••••"
          required>
        </p-password>
      </div>

      <button
        pButton
        type="submit"
        severity="success"
        styleClass="w-full mt-3"
        [loading]="loading()"
        [disabled]="loading() || !email || !password">
        <i class="pi pi-sign-in"></i>
        <span>{{ 'AUTH.LOGIN_SUBMIT' | translate }}</span>
      </button>
    </form>

    <ng-template #footer>
      @if (isLocal) {
      <div class="quick-login-box">
        <div class="quick-login-header">
          <span class="badge-dev"><i class="pi pi-bolt"></i> LOCAL DEV</span>
          <span class="quick-login-title">{{ 'AUTH.QUICK_LOGIN_TITLE' | translate }}</span>
        </div>
        <p class="quick-login-desc">{{ 'AUTH.QUICK_LOGIN_DESC' | translate }}</p>
      
        <div class="quick-buttons-grid">
          <button type="button" class="quick-btn admin-btn" [disabled]="loading()"
            (click)="quickLogin('admin@padelranking.dev', 'Admin123!')" title="Entrar como Administrador">
            <div class="btn-role">👑 Administrador</div>
            <div class="btn-email">admin&#64;padelranking.dev</div>
          </button>
      
          <button type="button" class="quick-btn org-btn" [disabled]="loading()"
            (click)="quickLogin('organizador1@padelranking.dev', 'Org123!')" title="Entrar como Organizador 1">
            <div class="btn-role">🏆 Organizador 1</div>
            <div class="btn-email">organizador1&#64;padelranking.dev</div>
          </button>
      
          <button type="button" class="quick-btn org-btn" [disabled]="loading()"
            (click)="quickLogin('organizador2@padelranking.dev', 'Org123!')" title="Entrar como Organizador 2">
            <div class="btn-role">🏆 Organizador 2</div>
            <div class="btn-email">organizador2&#64;padelranking.dev</div>
          </button>
      
          <button type="button" class="quick-btn team-btn" [disabled]="loading()"
            (click)="quickLogin('equipo1@padelranking.dev', 'Team123!')" title="Entrar como Los Ases">
            <div class="btn-role">🎾 Equipo 1 (Los Ases)</div>
            <div class="btn-email">equipo1&#64;padelranking.dev</div>
          </button>
      
          <button type="button" class="quick-btn team-btn" [disabled]="loading()"
            (click)="quickLogin('equipo2@padelranking.dev', 'Team123!')" title="Entrar como Smash Bros">
            <div class="btn-role">🎾 Equipo 2 (Smash Bros)</div>
            <div class="btn-email">equipo2&#64;padelranking.dev</div>
          </button>
        </div>
      </div>
      }
    </ng-template>
  </p-card>
</div>
