<div class="landing-page">
  <!-- Hero & Selector -->
  <rpm-hero
    [rankings]="rankings()"
    [selectedRanking]="selectedRanking()"
    (rankingChange)="onRankingChange($event)">
  </rpm-hero>

  <!-- Ranking Summary Info -->
  @if (selectedRanking()) {
    <rpm-ranking-info [ranking]="selectedRanking()"></rpm-ranking-info>
  }

  <!-- Standings / Clasificación -->
  <rpm-standings
    [classification]="classification()"
    [loading]="loadingClassification()"
    [viewMode]="viewMode()"
    (modeChange)="setMode($event)">
  </rpm-standings>

  <!-- Matches & Results -->
  <rpm-matches [matches]="matches()"></rpm-matches>

  <!-- Rules / Reglamento -->
  <rpm-rules></rpm-rules>
</div>
