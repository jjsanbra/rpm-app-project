<div class="admin-dashboard container">
  <!-- Top Bar / Header with Tabs -->
  <rpm-admin-header
    [activeTab]="activeTab()"
    [isAdmin]="isAdmin()"
    [rankingsCount]="rankings().length"
    [teamsCount]="teams().length"
    [matchesCount]="matches().length"
    [openIncidentsCount]="openIncidentsCount()"
    [organizersCount]="organizers().length"
    (tabChange)="setTab($event)">
  </rpm-admin-header>

  <!-- TAB 1: RANKINGS -->
  @if (activeTab() === 'rankings') {
    <rpm-admin-rankings
      [rankings]="rankings()"
      [locations]="locationsList()"
      [levels]="levelsList()"
      [categories]="categoriesList()"
      (createRanking)="handleCreateRanking($event)"
      (updateRanking)="handleUpdateRanking($event)"
      (toggleActive)="toggleRankingActive($event)"
      (selectForMatches)="selectRankingForMatches($event)"
      (deleteRanking)="handleDeleteRanking($event)">
    </rpm-admin-rankings>
  }

  <!-- TAB 2: TEAMS -->
  @if (activeTab() === 'teams') {
    <rpm-admin-teams
      [teams]="teams()"
      (createTeam)="handleCreateTeam($event)"
      (updateTeam)="handleUpdateTeam($event)"
      (toggleActive)="toggleTeamActive($event)"
      (resendWelcome)="resendTeamWelcome($event)">
    </rpm-admin-teams>
  }

  <!-- TAB 3: MATCHES -->
  @if (activeTab() === 'matches') {
    <rpm-admin-matches
      [rankings]="rankings()"
      [selectedRankingId]="selectedRankingId()"
      [matches]="matches()"
      (rankingChange)="onRankingSelectChange($event)"
      (generateMatches)="generateRoundRobin()"
      (overrideMatch)="handleAdminOverride($event)">
    </rpm-admin-matches>
  }

  <!-- TAB 4: INCIDENTS -->
  @if (activeTab() === 'incidents') {
    <rpm-admin-incidents
      [incidents]="incidents()"
      (resolveIncident)="handleResolveIncident($event)">
    </rpm-admin-incidents>
  }

  <!-- TAB 5: AUXILIARY -->
  @if (activeTab() === 'auxiliary') {
    <rpm-admin-auxiliary
      [auxType]="auxType()"
      [items]="auxItems()"
      (auxTypeChange)="setAuxType($event)"
      (createItem)="handleCreateAuxItem($event)"
      (deleteItem)="handleDeleteAuxItem($event)">
    </rpm-admin-auxiliary>
  }

  <!-- TAB 6: AUDIT (Solo Admin) -->
  @if (activeTab() === 'audit' && isAdmin()) {
    <rpm-admin-audit
      [logs]="auditLogs()">
    </rpm-admin-audit>
  }

  <!-- TAB 7: ORGANIZADORES (Solo Admin) -->
  @if (activeTab() === 'organizers' && isAdmin()) {
    <rpm-admin-organizers
      [organizers]="organizers()"
      (createOrganizer)="handleCreateOrganizer($event)"
      (updateOrganizer)="handleUpdateOrganizer($event)"
      (deleteOrganizer)="handleDeleteOrganizer($event)">
    </rpm-admin-organizers>
  }
</div>
