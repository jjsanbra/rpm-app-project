<div class="team-portal container">
  <!-- Header de Equipo -->
  <rpm-team-header
    [team]="team()"
    [fallbackTeamName]="authService.currentUser()?.teamName || ''"
    [matchesCount]="matches().length"
    [confirmedCount]="countConfirmed()"
    [pendingCount]="countPending()">
  </rpm-team-header>

  <!-- Listado de Partidos -->
  <rpm-team-matches
    [matches]="matches()"
    [loading]="loading()"
    [currentTeamId]="authService.currentUser()?.teamId"
    [currentUserId]="authService.currentUser()?.id"
    (submitResult)="openSubmitModal($event)"
    (confirmResult)="confirmMatch($event)"
    (openDispute)="openDisputeModal($event)">
  </rpm-team-matches>

  <!-- Modal Registrar Resultado -->
  <rpm-submit-result-modal
    [visible]="showSubmitModal()"
    [match]="activeSubmitMatch()"
    [submitting]="submitting()"
    (visibleChange)="showSubmitModal.set($event)"
    (submitResult)="handleSubmitResult($event)">
  </rpm-submit-result-modal>

  <!-- Modal Comunicar Incidencia -->
  <rpm-dispute-modal
    [visible]="showDisputeModal()"
    [match]="activeDisputeMatch()"
    [submitting]="submitting()"
    (visibleChange)="showDisputeModal.set($event)"
    (submitDispute)="handleSubmitDispute($event)">
  </rpm-dispute-modal>
</div>
